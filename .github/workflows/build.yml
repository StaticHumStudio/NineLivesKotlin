name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Debug builds do not minify, so nothing above this line can see an R8
      # shrinking regression. Running the release R8 pass here (no signing needed)
      # triggers verifyWorkManagerKeepRules against a real usage.txt. See issue #64.
      - name: Verify R8 keep rules survive release shrinking
        run: ./gradlew :app:minifyReleaseWithR8
